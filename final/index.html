<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Wheels of Volume</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="" />
  <link rel="icon" href="favicon.png">
  <link href="https://api.fontshare.com/v2/css?f[]=author@1&display=swap" rel="stylesheet"> 
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Wheels of Volume</h1>
  <details>
    <summary>Click to set Volume</summary>
    
    <div class="wheels">
      <div class="volumeGroup">
        <aside id="VolumeNumber">0</aside>
        <progress id="Volume" value="0" max="100"></progress>
      </div>
      <ul id="Memory"></ul>

      <div>
        <canvas id="NumberWheel" width="300" height="300"></canvas>
        <canvas id="MemoryWheel" width="300" height="300"></canvas>
        <canvas id="OperationWheel" width="300" height="300"></canvas>
        <canvas id="DisasterWheel" width="300" height="300"></canvas>
        <canvas id="FinalWheel" width="300" height="300"></canvas>
      </div>
    </div>
  </details>
    <script src="main.js"></script>
</body>
</html>
